# this_file: pyproject.toml
[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "vexy-speakup"
dynamic = ["version"]
description = "Diarize, restore, level and master recorded speech with local VST3 plugins, keeping the video timeline"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Adam Twardoch", email = "adam+github@twardoch.com" }]
keywords = ["speech", "audio", "vst3", "diarization", "loudness", "mastering", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fire>=0.7.1,<0.8",
    "numpy>=2,<3",
    "pedalboard==0.9.26",
    "platformdirs>=4,<5",
    "pydantic>=2.10,<3",
    "pyloudnorm>=0.2,<0.3",
    "soundfile>=0.13.1,<0.14",
    "tomli-w>=1,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
    "build>=1.2",
    "twine>=6",
    "httpx>=0.28,<1",
]
models = [
    "huggingface-hub>=1,<2",
    "mlx-audio==0.5.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "onnxruntime>=1.17",
    "sentencepiece>=0.2",
    "speechonnxmetrics[audio]==0.0.2a3",
]
gui = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
vexy-speakup = "vexy_speakup.cli:main"

[project.urls]
Homepage = "https://github.com/vexyart/vexy-speakup"
Documentation = "https://vexy.dev/vexy-speakup/"
Repository = "https://github.com/vexyart/vexy-speakup"
Issues = "https://github.com/vexyart/vexy-speakup/issues"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/vexy_speakup/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vexy_speakup"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/README.md", "/LICENSE", "/pyproject.toml", "/CHANGELOG.md", "/DEPENDENCIES.md", "/test.sh"]
exclude = [".omc", "__pycache__", "*.wav", "*.mp4", "*.m4a"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.coverage.run]
source = ["vexy_speakup"]
patch = ["subprocess"]
